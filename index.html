<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BNPL Sales Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f4fb;--card:#fff;--ink:#1d1633;--mute:#6b6485;--line:#e4dff2;--brand:#5b2bd6;--brand-ink:#fff;--ok:#0f8a5f;--bad:#c4372f}
@media (prefers-color-scheme:dark){:root{--bg:#14101f;--card:#1e1830;--ink:#efeaff;--mute:#a79fc4;--line:#352c52;--brand:#8b64ff;--brand-ink:#14101f;--ok:#46d19b;--bad:#ff7d74}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:var(--brand);color:var(--brand-ink)}
header b{font-weight:800;font-size:18px}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
h2{margin:0 0 12px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mute);font-weight:600}
input,select,textarea{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
button{padding:9px 16px;border:0;border-radius:6px;background:var(--brand);color:var(--brand-ink);font:600 14px inherit;cursor:pointer}
button.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats div{font-size:13px;color:var(--mute)}.stats strong{display:block;font-size:24px;color:var(--ink)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
td select{width:auto;margin:0;padding:4px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.bar>*{flex:1;min-width:140px;margin:0}
#login{max-width:360px;margin:12vh auto}
.msg{font-size:13px;margin-top:8px;min-height:18px}.err{color:var(--bad)}.good{color:var(--ok)}
.hide{display:none!important}
</style>
</head>
<body>

<section id="login" class="card hide">
  <h2>Sign in to Sales Monitor</h2>
  <label>Access code<input id="code" autocomplete="off" autocapitalize="characters" placeholder="Enter your access code"></label>
  <p><button id="loginBtn">Sign in</button></p>
  <div id="loginMsg" class="msg err"></div>
</section>

<div id="app" class="hide">
  <header><div><b>BNPL Sales Monitor</b></div><div><span id="who"></span> <button class="ghost" id="logout">Sign out</button></div></header>
  <main>
    <section class="card hide" id="formCard">
      <h2>Add a new lead</h2>
      <div class="grid">
        <label>Customer name<input id="f_name"></label>
        <label>Mobile number<input id="f_mobile" inputmode="tel" placeholder="09XXXXXXXXX"></label>
        <label>Item interested<input id="f_item" placeholder="e.g. iPhone 15, Aircon"></label>
        <label>Loan amount (PHP)<input id="f_amt" type="number" min="0" step="0.01"></label>
        <label>Term (months)<select id="f_term"><option>3</option><option>6</option><option selected>12</option><option>18</option><option>24</option></select></label>
        <label>Store / location<input id="f_loc"></label>
      </div><br>
      <label>Remarks<textarea id="f_rem" rows="2"></textarea></label>
      <p><button id="saveBtn">Save lead</button></p>
      <div id="formMsg" class="msg"></div>
    </section>

    <section class="card"><div class="stats" id="stats"></div></section>

    <section class="card">
      <h2 id="listTitle">Leads</h2>
      <div class="bar">
        <input id="q" placeholder="Search name, mobile or item">
        <select id="fStatus"><option value="">All statuses</option></select>
        <select id="fPro" class="hide"><option value="">All promoters</option></select>
        <button class="ghost" id="csv">Export CSV</button>
      </div>
      <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
      <div id="empty" class="msg">No leads yet.</div>
    </section>
  </main>
</div>

<script>
// ====== CONFIGURE THESE (Supabase > Project Settings > API) ======
const SUPABASE_URL = "https://wxflqiswoifwpyxjtgis.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4ZmxxaXN3b2lmd3B5eGp0Z2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNDA1ODAsImV4cCI6MjEwNzcxNjU4MH0.isva0tkzWyc_XSZQhYoXIxrymKB_24gIrIFQZSqzpCE";   // the anon key is safe to publish; RLS protects the data
// =================================================================
const STATUSES = ["New","Contacted","Applied","Approved","Declined","Disbursed"];
const ROLE_NAME = {HO:"Head Office",RSM:"Regional Sales Manager",TSM:"Territory Sales Manager",PROMOTER:"Promoter"};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let me, people = {}, leads = [];
const peso = n => "₱" + Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2});
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ $("login").classList.remove("hide"); $("app").classList.add("hide"); return; }
  const {data:profs,error} = await sb.from("profiles").select("*");
  if(error||!profs.length){ await sb.auth.signOut(); $("loginMsg").textContent="No profile set up for this account. Contact Head Office."; $("login").classList.remove("hide"); return; }
  people = Object.fromEntries(profs.map(p=>[p.id,p]));
  me = people[session.user.id];
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  $("who").textContent = `${me.full_name} (${ROLE_NAME[me.role]})`;
  $("formCard").classList.toggle("hide", me.role!=="PROMOTER");
  $("listTitle").textContent = me.role==="PROMOTER" ? "My leads" : me.role==="HO" ? "All leads" : "Leads in my team";
  $("fStatus").innerHTML = '<option value="">All statuses</option>'+STATUSES.map(s=>`<option>${s}</option>`).join("");
  const showPro = me.role!=="PROMOTER";
  $("fPro").classList.toggle("hide",!showPro);
  if(showPro) $("fPro").innerHTML = '<option value="">All promoters</option>'+profs.filter(p=>p.role==="PROMOTER").map(p=>`<option value="${p.id}">${esc(p.full_name)}</option>`).join("");
  await load();
}

async function load(){
  const {data,error} = await sb.from("leads").select("*").order("created_at",{ascending:false});
  if(error){ $("empty").textContent="Could not load leads: "+error.message; return; }
  leads = data; render();
}

function filtered(){
  const q=$("q").value.toLowerCase(), st=$("fStatus").value, pr=$("fPro").value;
  return leads.filter(l=>(!st||l.status===st)&&(!pr||l.promoter_id===pr)&&
    (!q||[l.customer_name,l.mobile,l.item].join(" ").toLowerCase().includes(q)));
}

function render(){
  const rows=filtered(), team=me.role!=="PROMOTER";
  const approved=rows.filter(l=>["Approved","Disbursed"].includes(l.status));
  $("stats").innerHTML=`<div>Leads<strong>${rows.length}</strong></div><div>Total loan value<strong>${peso(rows.reduce((a,l)=>a+Number(l.loan_amount),0))}</strong></div><div>Approved / disbursed<strong>${approved.length}</strong></div>`;
  $("thead").innerHTML="<tr><th>Date</th>"+(team?"<th>Promoter</th>":"")+"<th>Customer</th><th>Mobile</th><th>Item</th><th>Loan</th><th>Term</th><th>Location</th><th>Status</th><th>Remarks</th></tr>";
  $("tbody").innerHTML=rows.map(l=>`<tr><td>${new Date(l.created_at).toLocaleDateString("en-PH")}</td>`+
    (team?`<td>${esc(people[l.promoter_id]?.full_name)}</td>`:"")+
    `<td>${esc(l.customer_name)}</td><td>${esc(l.mobile)}</td><td>${esc(l.item)}</td><td>${peso(l.loan_amount)}</td><td>${l.term_months||""} mo</td><td>${esc(l.location)}</td>`+
    `<td><select data-id="${l.id}" aria-label="Status">${STATUSES.map(s=>`<option ${s===l.status?"selected":""}>${s}</option>`).join("")}</select></td><td>${esc(l.remarks)}</td></tr>`).join("");
  $("empty").classList.toggle("hide",rows.length>0);
  $("empty").textContent="No leads match.";
}

$("loginBtn").onclick=async()=>{
  $("loginMsg").textContent="";
  const code=$("code").value.trim().toUpperCase();
  if(!code){ $("loginMsg").textContent="Enter your access code."; return; }
  const {error}=await sb.auth.signInWithPassword({email:code.toLowerCase()+"@codes.example.com",password:code});
  if(error) $("loginMsg").textContent="Access code not recognized. Check it or contact Head Office."; else boot();
};
$("logout").onclick=async()=>{await sb.auth.signOut(); location.reload();};

$("saveBtn").onclick=async()=>{
  const m=$("formMsg"), name=$("f_name").value.trim(), mobile=$("f_mobile").value.trim(), item=$("f_item").value.trim(), amt=parseFloat($("f_amt").value);
  if(!name||!/^(09|\+639)\d{9}$/.test(mobile.replace(/[\s-]/g,""))||!item||!(amt>0)){ m.className="msg err"; m.textContent="Enter name, a valid PH mobile number (09XXXXXXXXX), item and loan amount."; return; }
  const {error}=await sb.from("leads").insert({customer_name:name,mobile:mobile.replace(/[\s-]/g,""),item,loan_amount:amt,term_months:+$("f_term").value,location:$("f_loc").value.trim(),remarks:$("f_rem").value.trim()});
  if(error){ m.className="msg err"; m.textContent=error.message; return; }
  ["f_name","f_mobile","f_item","f_amt","f_loc","f_rem"].forEach(i=>$(i).value="");
  m.className="msg good"; m.textContent="Lead saved."; load();
};

$("tbody").addEventListener("change",async e=>{
  if(e.target.dataset.id){ const {error}=await sb.from("leads").update({status:e.target.value}).eq("id",e.target.dataset.id); if(error) alert(error.message); load(); }
});
["q","fStatus","fPro"].forEach(i=>$(i).addEventListener("input",render));

$("csv").onclick=()=>{
  const head=["Date","Promoter","Customer","Mobile","Item","Loan","Term","Location","Status","Remarks"];
  const lines=filtered().map(l=>[l.created_at.slice(0,10),people[l.promoter_id]?.full_name,l.customer_name,l.mobile,l.item,l.loan_amount,l.term_months,l.location,l.status,l.remarks].map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(","));
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([[head.join(","),...lines].join("\n")],{type:"text/csv"})); a.download="leads.csv"; a.click();
};

boot();
</script>
</body>
</html>
